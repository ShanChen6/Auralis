[project]
name = "auralis-audio-ai"
version = "0.1.0"
description = "Auralis Hybrid TTS & radio post-production service (FastAPI)"
authors = [{ name = "Shan Dev" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "edge-tts>=7.3.1",
    "pydub>=0.25.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "boto3>=1.44.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "boto3-stubs[s3]>=1.44.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: gọi dịch vụ thật qua mạng (chạy bằng -m network)"]
addopts = "-m 'not network'"
