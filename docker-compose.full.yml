# Chạy toàn bộ backend Auralis bằng Docker (thử bản production ở máy hoặc tự host).
#   docker compose -f docker-compose.full.yml up -d --build
# Web Next.js triển khai trên Vercel (hoặc chạy `pnpm --filter auralis-web build && start`).
name: auralis-full

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auralis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auralis}
      POSTGRES_DB: auralis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralis -d auralis"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  audio-ai:
    build: ./auralis-audio-ai
    image: auralis-audio-ai
    restart: unless-stopped
    environment:
      PORT: 7860
      AUDIO_AI_API_KEY: ${AUDIO_AI_API_KEY:?Đặt AUDIO_AI_API_KEY trong .env}
      PUBLIC_BASE_URL: http://localhost:8000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      VOICESTUDIO_URL: ${VOICESTUDIO_URL:-http://host.docker.internal:3900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:7860"

  api:
    build:
      context: .
      dockerfile: auralis-api/Dockerfile
    image: auralis-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      audio-ai: { condition: service_started }
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://auralis:${POSTGRES_PASSWORD:-auralis}@postgres:5432/auralis?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (tối thiểu 32 ký tự) trong .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://host.docker.internal:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      AUDIO_AI_URL: http://audio-ai:7860
      AUDIO_AI_API_KEY: ${AUDIO_AI_API_KEY}
      STORAGE_LOCAL_FALLBACK: ${STORAGE_LOCAL_FALLBACK:-true}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"

volumes:
  postgres-data:
  redis-data:
